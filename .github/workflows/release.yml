name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/WxADT-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WxADT ${{ github.ref_name }}
          body: |
            ## WxADT ${{ github.ref_name }}

            基于 LSPosed 的微信增强模块，适配微信 **8.0.72**。

            ### 功能
            - 🤖 AI 智能回复（支持 OpenAI 兼容接口）
            - 🛡️ 防撤回
            - 🎵 语音变声
            - 💰 自动收款
            - 🧧 自动收红包

            ### 安装
            1. 在 LSPosed 管理器中安装 APK
            2. 作用域勾选 **微信**
            3. 强制停止微信并重启
            4. 进入微信设置页，点击右下角 **🛡️ 极客面板** 配置功能
          files: app/build/outputs/apk/release/WxADT-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
